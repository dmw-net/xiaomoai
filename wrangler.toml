# ============================================
# wrangler.toml - Cloudflare Pages 项目配置
# ============================================
# 此文件用于 wrangler CLI 本地开发和预览
# Cloudflare Pages 部署主要通过仪表盘配置
# ============================================

name = "ai-study-buddy"
compatibility_date = "2026-06-09"

# Pages 项目配置
pages_build_output_dir = "./dist"

# ---- 环境变量 ----
# 注意：敏感信息不应写在此文件中
# 应在 Cloudflare Pages 仪表盘 Settings > Environment variables 中配置
# ============================================

# 开发环境
[env.dev]
vars = { VITE_API_BASE_URL = "http://localhost:8081" }

# 生产环境 - VITE_API_BASE_URL 在仪表盘中配置（加密）
# [env.production]
# vars = { VITE_API_BASE_URL = "https://api.your-domain.com" }